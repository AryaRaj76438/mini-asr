[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-asr"
version = "0.1.0"
description = "A from-scratch automatic speech recognition library for learning and research"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "soundfile"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]